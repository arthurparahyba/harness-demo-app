# Pipeline no formato Harness 3.0 (YAML v1)
pipeline:
  id: harness_demo_app
  name: harness-demo-app
  clone:
    enabled: true
    depth: 1
  stages:
    - name: Build e Teste
      id: build_and_test
      steps:
        - name: Instalar dependencias
          id: install
          run:
            shell: sh
            script: |
              node -v
              npm ci
        - name: Rodar testes
          id: test
          run:
            shell: sh
            script: npm run test:ci
